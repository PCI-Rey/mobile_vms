name: flutter_visitor_app
description: "Visitor App"

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  camera: ^0.11.2
  carousel_slider: ^5.1.1
  country_flags: ^3.3.0
  cupertino_icons: ^1.0.8
  date_picker_timeline: ^1.2.7
  device_info_plus: ^11.5.0
  dropdown_search: ^6.0.2
  faker: ^2.2.0
  fl_chart: ^1.0.0
  flutter:
    sdk: flutter
  flutter_gen_runner: ^5.11.0
  flutter_localization: ^0.3.3
  flutter_localizations:
    sdk: flutter
  flutter_onboarding_slider: ^1.0.11
  font_awesome_flutter: ^10.8.0
  gal: ^2.3.2
  get: ^4.7.3
  google_fonts: ^8.0.2
  image_picker: ^1.1.2
  dropdown_button2: ^2.3.9
  intl: ^0.20.2
  introduction_screen: ^3.1.17
  mobile_scanner: ^7.0.1
  path_provider: ^2.1.5
  permission_handler: ^12.0.1
  pinput: ^5.0.1
  shared_preferences: ^2.5.3
  shimmer: ^3.0.0
  signature: ^6.3.0
  dio: ^5.7.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  qr_flutter: ^4.1.0
  pdf: ^3.10.8
  firebase_core: ^2.32.0
  firebase_messaging: ^14.7.10

dev_dependencies:
  build_runner: ^2.6.0
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
    - assets/icons/

flutter_gen:
  output: lib/core/gen/
  line_length: 80

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/vms.png"
  adaptive_icon_foreground: "assets/images/vms.png"
  min_sdk_android: 21
